- name: Include distro-specific variables
  ansible.builtin.include_vars:
    file: "{{ ansible_distribution }}_{{ ansible_distribution_release }}.yml"

- name: Ensure polkit is installed
  ansible.builtin.package:
    name: "{{ polkit_name }}"
    state: present

- name: Manage polkit configuration files
  ansible.posix.synchronize:
    src: rules.d
    dest: /etc/polkit-1/
    archive: false
    recursive: true
    delete: true
    times: true
  notify: restart-polkit

- name: Ensure polkit service is running
  ansible.builtin.service:
    name: polkit
    state: started
    enabled: true
  when: not partial_install
