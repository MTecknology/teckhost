#!/usr/sbin/nft -f

# Replace only our own table. "flush ruleset" would also destroy fail2ban's
# inet f2b-table, silently dropping every active ban on reload. The bare
# declaration creates the table if absent so the delete cannot fail.
table inet filter
delete table inet filter

table inet filter {

	chain input {
		# Drop all incoming traffic by default
		type filter hook input priority 0; policy drop;

		# Allow traffic from established and related packets, drop invalid
		ct state vmap { established : accept, related : accept, invalid : drop };

		# Allow loopback traffic.
		iifname lo accept;

		# Jump to input_ipvX according to layer 3 protocol
		meta protocol vmap { ip : jump input_ipv4, ip6 : jump input_ipv6 };

		# Special administrative rules
{% for rule in common_firewall_admin %}
		{{ rule }};{% endfor %}

		# Host-based whitelist
{% for rule in common_firewall_input %}
		{{ rule }};{% endfor %}
	}

	chain input_ipv4 {
		# Allow ping
		icmp type echo-request limit rate 5/second accept;

		# Allow VRRP protocol (number 112)
		ip protocol vrrp accept;
	}

	chain input_ipv6 {
		# Allow ping
		icmpv6 type echo-request limit rate 5/second accept;

		# Allow neighbour discovery
		icmpv6 type { nd-neighbor-solicit, nd-router-advert, nd-neighbor-advert } accept;
	}

	chain output {
		# Do not restrict outbound traffic
		type filter hook output priority filter; policy accept;
	}

	chain forward {
		# Drop everything (assumes this device is not a router)
		type filter hook forward priority 0; policy drop;

		# Return traffic still has to pass for any host that does forward
		ct state vmap { established : accept, related : accept, invalid : drop };

		# Host-based forwards
{% for rule in common_firewall_forward %}
		{{ rule }};{% endfor %}
	}
}
{{ common_firewall_extra }}
